<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Hệ Thống</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Đăng Nhập Hệ Thống</h3>
                        <p class="text-muted small">Xác thực an toàn với JSON Web Token (JWT)</p>
                    </div>

                    <!-- Khung thông báo lỗi -->
                    <div id="errorAlert" class="alert alert-danger d-none py-2 text-center" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" id="email" class="form-control form-control-lg" placeholder="Nhập email của bạn..." required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" id="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu..." required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Đăng Nhập</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng file JavaScript xử lý -->
    <script src="/js/mainjs.js"></script>
</body>
</html>
