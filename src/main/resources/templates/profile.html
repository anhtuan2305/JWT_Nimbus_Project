<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Tài Khoản</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 profile-card" style="width: 400px; border-radius: 15px;">
        <h3 class="text-center text-success mb-3">Thông Tin Tài Khoản</h3>
        <p class="text-center text-muted mb-4">Phiên làm việc được bảo mật qua JWT</p>

        <div class="mb-3 d-flex justify-content-between align-items-center">
            <span class="fw-bold">Email đăng nhập:</span>
            <!-- Dữ liệu email sẽ được JavaScript điền vào đây -->
            <span id="userEmail" class="text-dark fw-semibold">Đang tải...</span>
        </div>

        <div class="mb-4 d-flex justify-content-between align-items-center">
            <span class="fw-bold">Trạng thái bảo mật:</span>
            <span class="badge bg-success">Đã xác thực (Active)</span>
        </div>

        <button id="btnLogout" class="btn btn-danger w-100 py-2 fw-bold">Đăng Xuất</button>
    </div>

    <!-- Nhúng file mainjs.js -->
    <script th:src="@{/js/mainjs.js}"></script>
</body>
</html>
